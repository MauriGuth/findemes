# Local infrastructure only. Production runs on Railway (see railway.json).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: findemes
      POSTGRES_PASSWORD: findemes
      POSTGRES_DB: findemes
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U findemes -d findemes']
      interval: 5s
      timeout: 3s
      retries: 10

  # Not used by the code yet: phase 2 decides between BullMQ and a jobs table (ADR 005).
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

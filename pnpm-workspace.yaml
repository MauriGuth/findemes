packages:
  - apps/*
  - packages/*

# pnpm >= 10 skips lifecycle scripts of dependencies unless they are listed here.
# Prisma needs its postinstall to download the schema engine used by `migrate deploy`.
onlyBuiltDependencies:
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma
  - unrs-resolver
